<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جاذبه‌های گردشگری | شهرآوا</title>
    <meta
      name="description"
      content="جاذبه‌های گردشگری، مکان‌های دیدنی تاریخی، موزه‌ها و شگفتی‌های معماری شهرهای جهان را در شهرآوا کشف کنید."
    />
    <meta property="og:title" content="جاذبه‌های گردشگری | شهرآوا" />
    <meta property="og:description" content="جاذبه‌های گردشگری، مکان‌های دیدنی تاریخی، موزه‌ها و شگفتی‌های معماری شهرهای جهان را در شهرآوا کشف کنید." />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/output.css" />
    <link rel="stylesheet" href="../css/input.css" />

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Main JS -->
    <script type="module" src="../js/main.js"></script>
  </head>

  <body class="bg-[var(--bg)] text-[var(--text)] min-h-screen flex flex-col">
    <header class="relative w-full z-50">
      <div id="navbar"></div>
    </header>

    <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 space-y-8">
      <!-- HEADER BANNER -->
      <section class="rounded-3xl border border-[var(--border)] bg-[var(--card)] p-8 md:p-12 shadow-sm text-center">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-bold text-[var(--primary)] mb-3">
          🏛️ DISCOVER ATTRACTIONS & LANDMARKS
        </span>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-[var(--text)]">
          جاذبه‌های گردشگری شهرهای جهان
        </h1>
        <p class="mt-3 max-w-2xl mx-auto text-base text-[var(--muted)] leading-8">
          مکان‌های دیدنی، کاخ‌های تاریخی، موزه‌ها، شاهکارهای معماری و بوستان‌های سرسبز را بر اساس شهر و دسته‌بندی کشف کنید.
        </p>

        <!-- City filter search -->
        <div class="mt-8 max-w-xl mx-auto flex flex-col sm:flex-row gap-3">
          <input
            id="attraction-city-input"
            type="search"
            value="تهران"
            placeholder="نام شهر را وارد کنید (مثلاً تهران، اصفهان، پاریس، رم)..."
            class="flex-1 rounded-2xl border border-[var(--border)] bg-[var(--surface)] px-4 py-3.5 text-sm text-[var(--text)] outline-none focus:border-[var(--primary)]"
          />
          <button
            id="btn-attraction-search"
            type="button"
            class="rounded-2xl bg-[var(--primary)] px-8 py-3.5 font-bold text-sm text-white shadow-md hover:opacity-90 active:scale-95 transition-all"
          >
            مشاهده جاذبه‌ها
          </button>
        </div>

        <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
          <span class="text-xs text-[var(--muted)]">شهرهای پیشنهادی:</span>
          <button class="att-quick-city px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-semibold hover:border-[var(--primary)]" data-city="تهران">تهران</button>
          <button class="att-quick-city px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-semibold hover:border-[var(--primary)]" data-city="اصفهان">اصفهان</button>
          <button class="att-quick-city px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-semibold hover:border-[var(--primary)]" data-city="شیراز">شیراز</button>
          <button class="att-quick-city px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-semibold hover:border-[var(--primary)]" data-city="استانبول">استانبول</button>
          <button class="att-quick-city px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-semibold hover:border-[var(--primary)]" data-city="Paris">پاریس</button>
          <button class="att-quick-city px-3 py-1 rounded-full border border-[var(--border)] bg-[var(--surface)] text-xs font-semibold hover:border-[var(--primary)]" data-city="Rome">رم</button>
        </div>
      </section>

      <!-- ATTRACTIONS CONTENT -->
      <section id="attractions-container"></section>

      <!-- MAP SECTION -->
      <section>
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-xl font-bold text-[var(--text)]">موقعیت جاذبه‌ها روی نقشه</h2>
          <span class="text-xs text-[var(--muted)]">OpenStreetMap</span>
        </div>
        <div class="overflow-hidden rounded-3xl border border-[var(--border)] bg-[var(--card)] shadow-sm">
          <div id="leaflet-map" class="w-full h-[400px]"></div>
        </div>
      </section>
    </main>

    <footer>
      <div id="footer"></div>
    </footer>

    <script type="module">
      import { searchCityDetails, fetchCityAttractions } from "../js/city-intelligence.js";

      let attractionsMap = null;
      let markers = [];
      let currentAttractions = [];
      let activeCategory = "همه";

      async function loadAttractionsForCity(cityName) {
        const container = document.getElementById("attractions-container");
        if (container) {
          container.innerHTML = `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 animate-pulse">
              <div class="h-64 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
              <div class="h-64 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
              <div class="h-64 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
              <div class="h-64 rounded-2xl bg-slate-200 dark:bg-slate-800"></div>
            </div>
          `;
        }

        try {
          const city = await searchCityDetails(cityName);
          if (!city) {
            if (container) container.innerHTML = `<p class="p-8 text-center text-sm text-[var(--muted)]">شهری با نام «${cityName}» یافت نشد.</p>`;
            return;
          }

          const items = await fetchCityAttractions(city.lat, city.lon, city.name);
          currentAttractions = items;
          renderItems(items, city);
          initMap(city, items);
        } catch (err) {
          console.error(err);
          if (container) container.innerHTML = `<p class="p-8 text-center text-sm text-red-500">خطا در بارگذاری جاذبه‌ها.</p>`;
        }
      }

      function renderItems(items, city) {
        const container = document.getElementById("attractions-container");
        if (!container) return;

        if (items.length === 0) {
          container.innerHTML = `<p class="p-8 text-center text-sm text-[var(--muted)]">جاذبه گردشگری ثبت‌شده‌ای برای ${city.name} یافت نشد.</p>`;
          return;
        }

        const categories = ["همه", "تاریخی", "فرهنگی", "موزه", "پارک", "معماری", "مذهبی", "تفریحی", "طبیعت"];
        const filtered = activeCategory === "همه" ? items : items.filter((x) => x.category === activeCategory);

        container.innerHTML = `
          <div>
            <div class="flex flex-wrap gap-2 mb-6">
              ${categories
                .map((cat) => {
                  const count = cat === "همه" ? items.length : items.filter((x) => x.category === cat).length;
                  if (cat !== "همه" && count === 0) return "";
                  const active = activeCategory === cat;
                  return `
                  <button type="button" data-cat="${cat}" class="att-cat-btn px-4 py-2 rounded-xl text-xs font-bold border transition-all ${
                    active ? "bg-[var(--primary)] text-white border-[var(--primary)]" : "bg-[var(--card)] text-[var(--muted)] border-[var(--border)]"
                  }">
                    ${cat} (${count})
                  </button>
                `;
                })
                .join("")}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
              ${filtered
                .map(
                  (att) => `
                <div class="group overflow-hidden rounded-2xl border border-[var(--border)] bg-[var(--card)] flex flex-col shadow-sm hover:shadow-lg transition-all hover:-translate-y-1">
                  <div class="relative aspect-video w-full overflow-hidden bg-slate-100 dark:bg-slate-800">
                    ${
                      att.image
                        ? `<img src="${att.image}" alt="${att.name}" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" />`
                        : `<div class="h-full w-full flex items-center justify-center text-4xl text-slate-400">🏛️</div>`
                    }
                    <span class="absolute top-3 right-3 text-[11px] font-bold px-2.5 py-1 rounded-lg border backdrop-blur-md ${att.categoryColor}">
                      ${att.category}
                    </span>
                    <span class="absolute bottom-3 left-3 text-[11px] font-medium px-2 py-0.5 rounded-md bg-black/60 text-white backdrop-blur-sm">
                      ${att.distanceKm} کیلومتر
                    </span>
                  </div>
                  <div class="p-4 flex-1 flex flex-col justify-between">
                    <div>
                      <h4 class="font-bold text-base text-[var(--text)] line-clamp-1">${att.name}</h4>
                      <p class="mt-2 text-xs leading-6 text-[var(--muted)] line-clamp-2">${att.description}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-[var(--border)] flex items-center justify-between">
                      <a href="/cities/?q=${encodeURIComponent(city.name)}" class="text-xs font-bold text-[var(--primary)] hover:underline">
                        مشاهده شهر ${city.name} ←
                      </a>
                      <a href="${att.mapUrl}" target="_blank" rel="noopener noreferrer" class="text-[11px] text-[var(--muted)]">
                        نقشه ↗
                      </a>
                    </div>
                  </div>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        `;

        container.querySelectorAll(".att-cat-btn").forEach((btn) => {
          btn.onclick = () => {
            activeCategory = btn.getAttribute("data-cat");
            renderItems(items, city);
          };
        });
      }

      function initMap(city, items) {
        const mapEl = document.getElementById("leaflet-map");
        if (!mapEl || typeof L === "undefined") return;

        if (attractionsMap) {
          attractionsMap.remove();
          attractionsMap = null;
        }

        attractionsMap = L.map(mapEl).setView([city.lat, city.lon], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(attractionsMap);

        // Center marker
        L.marker([city.lat, city.lon]).addTo(attractionsMap).bindPopup(`<b>مرکز ${city.name}</b>`).openPopup();

        // Items markers
        items.forEach((item) => {
          L.marker([item.lat, item.lon]).addTo(attractionsMap).bindPopup(`
            <div style="font-family:'Vazirmatn',sans-serif; text-align:right; direction:rtl;">
              <b>${item.name}</b>
              <p style="font-size:11px; margin-top:2px;">${item.category} · فاصله: ${item.distanceKm} کیلومتر</p>
            </div>
          `);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("attraction-city-input");
        const btn = document.getElementById("btn-attraction-search");
        const trigger = () => {
          const val = input?.value.trim();
          if (val) loadAttractionsForCity(val);
        };

        if (btn) btn.onclick = trigger;
        if (input) {
          input.onkeydown = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              trigger();
            }
          };
        }

        document.querySelectorAll(".att-quick-city").forEach((b) => {
          b.onclick = () => {
            const c = b.getAttribute("data-city");
            if (input) input.value = c;
            loadAttractionsForCity(c);
          };
        });

        loadAttractionsForCity("تهران");
      });
    </script>
  </body>
</html>
